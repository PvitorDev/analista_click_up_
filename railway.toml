# Railway — API FastAPI (pasta server/)
#
# Um railway.toml = um serviço Railway. API e worker são DOIS serviços
# no mesmo projeto (mesmo repo, mesma pasta /server, configs diferentes).
#
# Serviço "api":
#   Root Directory = /server
#   Config as Code = /railway.toml
#
# Serviço "worker":
#   Root Directory = /server
#   Config as Code = /railway.worker.toml
#   (sem healthcheck / sem domínio público)
#
# Alternativa barata (não recomendada): um só serviço com
#   startCommand = "./start.sh"
# e start.sh sobe worker em background + uvicorn na frente — ver README deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
startCommand = "./start.sh"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
